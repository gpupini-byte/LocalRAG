name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and dashboard dependencies
        run: python -m pip install -e ".[dashboard,dev]"
      - name: Run offline regression suite
        run: python -m pytest -q
