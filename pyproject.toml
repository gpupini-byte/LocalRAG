[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localrag"
version = "0.1.0"
description = "A fully local, modular document question-answering engine."
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyMuPDF>=1.24,<2",
]
license = "AGPL-3.0-or-later"

[project.scripts]
localrag = "localrag.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]
embeddings = [
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<6",
]
retrieval = [
    "faiss-cpu>=1.8,<2",
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<6",
]
rag = [
    "faiss-cpu>=1.8,<2",
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<6",
]
dashboard = [
    "faiss-cpu>=1.8,<2",
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<6",
    "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
